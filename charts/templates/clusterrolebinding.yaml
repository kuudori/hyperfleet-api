{{- if .Values.config.server.jwt.enabled -}}
{{- $needsTokenReview := false -}}
{{- range .Values.config.server.jwt.issuers -}}
  {{- if eq .type "k8s-token-review" -}}
    {{- $needsTokenReview = true -}}
  {{- end -}}
{{- end -}}
{{- if $needsTokenReview }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperfleet-api.fullname" . }}-token-review
  labels:
    {{- include "hyperfleet-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperfleet-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
